name: Prism automated estimation and allocation

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  acknowledge:
    if: >-
      !github.event.issue.pull_request &&
      ((github.event_name == 'issues' &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)) ||
       (github.event_name == 'issue_comment' && github.event.comment.user.type != 'Bot' &&
        github.event.comment.body == '/prism estimate' &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)))
    runs-on: ubuntu-latest
    steps:
      - name: Acknowledge the request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          if [ -n "$COMMENT_ID" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" -f content=eyes > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/reactions" -f content=eyes > /dev/null
          fi
  estimate:
    if: >-
      !github.event.issue.pull_request &&
      ((github.event_name == 'issues' &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)) ||
       (github.event_name == 'issue_comment' && github.event.comment.user.type != 'Bot' &&
        github.event.comment.body == '/prism estimate' &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)))
    # Serialize all issues so the repository-wide reservation is visible before another gate runs.
    concurrency: prism-estimate
    runs-on: ubuntu-latest
    outputs:
      estimated: ${{ steps.estimate.outcome == 'success' }}
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      PRISM_SKIP_DOTENV: "1"
      ENTIRE_TOKEN: ${{ secrets.ENTIRE_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      REPLAY_REF: ${{ vars.PRISM_REPLAY_REF }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/setup-python@v5
        id: setup_python
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        id: setup_go
        with:
          go-version: stable
      - name: Install Prism
        id: install
        env:
          GIT_TERMINAL_PROMPT: "0"
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.PRISME_READ_TOKEN }}@github.com/Bhavya031/Prisme.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/Bhavya031/Prisme
        run: pip install "git+https://github.com/Bhavya031/Prisme.git@main" > /dev/null 2>&1 && python -c 'import neatlogs'
      - name: Resolve one immutable source commit
        id: source
        run: |
          ref="$REPLAY_REF"
          if [ -z "$ref" ]; then ref=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch); fi
          encoded_ref=$(jq -rn --arg ref "$ref" '$ref | @uri')
          commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$encoded_ref" --jq .sha)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo 'Could not resolve a source commit' >&2; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Source commit: $commit"
      - name: Check event, authorization, duplicates, and repository cooldown
        id: gate
        run: prism issue-gate --event "$GITHUB_EVENT_PATH" --commit "${{ steps.source.outputs.commit }}" >> "$GITHUB_OUTPUT"
      - name: Report repository cooldown
        if: steps.gate.outputs.note != ''
        env:
          NOTE: ${{ steps.gate.outputs.note }}
        # This reply has no Prism marker, so it cannot extend the cooldown or replace an estimate.
        run: gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$NOTE"
      - name: Reserve this issue before any paid call
        id: reserve
        if: steps.gate.outputs.note == ''
        run: |
          printf '%s\n' '<!-- prism-estimate -->' '<!-- prism-loading -->' \
            '### ⏳ Estimating' '' "Started: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" \
            "[Workflow run]($RUN_URL)" > comment.md
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" --jq \
            '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- prism-estimate -->"))) | .id' | tail -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" -F body=@comment.md > /dev/null
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.note == ''
        with:
          ref: ${{ steps.source.outputs.commit }}
          path: source
          persist-credentials: false
      - name: Run estimate
        id: estimate
        if: steps.gate.outputs.note == ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEATLOGS_API_KEY: ${{ secrets.NEATLOGS_API_KEY }}
          GOBIN: ${{ runner.temp }}/bin
          PRISM_GLANCE: ${{ runner.temp }}/bin/glance
        run: |
          set -euo pipefail
          jq -e --arg repo "$GITHUB_REPOSITORY" --argjson number "$ISSUE_NUMBER" \
            '.repository.full_name == $repo and .issue.number == $number and (.issue.pull_request | not)' \
            "$GITHUB_EVENT_PATH" > /dev/null
          issue_url=$(jq -r '.issue.html_url' "$GITHUB_EVENT_PATH")
          expected_url="https://github.com/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER"
          [ "$issue_url" = "$expected_url" ] || { echo 'Event issue URL does not match this repository and issue' >&2; exit 1; }
          jq -r '[.issue.title, (.issue.body // "")] | join("\n\n")' "$GITHUB_EVENT_PATH" > issue.txt
          # Settings come from this repository's default branch, not from the replayed commit.
          gh api -H 'Accept: application/vnd.github.raw' "repos/$GITHUB_REPOSITORY/contents/.github/prism.json" > prism.json || {
            echo '.github/prism.json is required in this repository; copy examples/prism.json from Prisme' >&2
            exit 1
          }
          setting() { jq -er ".estimate.$1" prism.json || { echo ".github/prism.json has no estimate.$1" >&2; exit 1; }; }
          provider=$(setting provider)
          worker_model=$(setting worker_model)
          max_cost_usd=$(setting max_cost_usd)
          max_output_tokens=$(setting max_output_tokens)
          max_extra_rounds=$(setting max_extra_rounds)
          timeout_seconds=$(setting timeout_seconds)
          entire_repo="gh/$GITHUB_REPOSITORY"
          if [ -z "$ENTIRE_TOKEN" ]; then
            echo 'ENTIRE_TOKEN is required; register and index this repository with Entire first' >&2
            exit 1
          fi
          go install github.com/entireio/cli/cmd/entire@latest > /dev/null 2>&1 || {
            echo 'Entire CLI installation failed before any model call' >&2
            exit 1
          }
          export PATH="$GOBIN:$PATH"
          python - "$entire_repo" <<'PY'
          import sys
          from prism.entire import ensure_ready
          ensure_ready(sys.argv[1])
          PY
          commit="${{ steps.source.outputs.commit }}"
          # Latest Glance release binary, checked against the release's sha256 list before it is unpacked.
          case "$(uname -m)" in x86_64) glance_arch=amd64 ;; aarch64 | arm64) glance_arch=arm64 ;; *) glance_arch=unsupported ;; esac
          glance_url="https://github.com/Bhavya031/Glance/releases/latest/download"
          (cd "$RUNNER_TEMP" &&
            curl -fsSL --retry 3 -O "$glance_url/checksums.txt" &&
            glance_archive=$(grep -oE "Glance_[^ ]+_linux_$glance_arch\.tar\.gz" checksums.txt | head -n 1) &&
            [ -n "$glance_archive" ] &&
            curl -fsSL --retry 3 -O "$glance_url/$glance_archive" &&
            grep -F "  $glance_archive" checksums.txt | sha256sum -c - > /dev/null &&
            mkdir -p "$GOBIN" && tar -xzf "$glance_archive" -C "$GOBIN" glance) > /dev/null 2>&1 || {
            echo "Latest Glance release download or sha256 check failed for linux $glance_arch; check that the release and its checksums.txt exist" >&2
            exit 1
          }
          python -c 'import os; from prism import glance; glance.measure("count check", glance=os.environ["PRISM_GLANCE"])' > /dev/null
          status=0
          # Entire names candidate files for a live issue; a replay searches only the pinned commit.
          search=entire
          if [ -n "$REPLAY_REF" ]; then search=git; fi
          prism predict "$issue_url" --repo "$entire_repo" --event "$GITHUB_EVENT_PATH" \
            --commit "$commit" --checkout source --search "$search" \
            --provider "$provider" --format json --max-cost-usd "$max_cost_usd" --max-output-tokens "$max_output_tokens" \
            --max-extra-rounds "$max_extra_rounds" --timeout-seconds "$timeout_seconds" > predict.json 2> predict.err || status=$?
          if [ "$status" -eq 0 ]; then
            prism solve-estimate --issue-file issue.txt --prediction predict.json --provider "$provider" \
              --commit "$commit" --checkout source --worker-model "$worker_model" --mode heuristic \
              > estimate.json 2> estimate.err || status=$?
          fi
          prism issue-comment --prediction predict.json --estimate estimate.json \
            --event "$GITHUB_EVENT_PATH" --commit "$commit" \
            --errors predict.err estimate.err --run-url "$RUN_URL" > comment.md || status=$?
          exit "$status"
      - name: Post or update the one Prism comment
        if: always() && (failure() || steps.reserve.outcome == 'success')
        run: |
          if [ "${{ steps.reserve.outcome }}" != 'success' ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --body "Prism stopped before it could reserve this issue. See the [workflow run]($RUN_URL)."
            exit 0
          fi
          if [ ! -s comment.md ] || grep -q '<!-- prism-loading -->' comment.md; then
            printf '%s\n' '<!-- prism-estimate -->' '### Prism estimate did not finish' '' \
              "**Stopped by:** setup failed before prediction. See the [workflow run]($RUN_URL)." > comment.md
          fi
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" --jq \
            '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- prism-estimate -->"))) | .id' | tail -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" -F body=@comment.md > /dev/null
          fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outcome == 'success'
        with:
          name: prism-estimate-${{ github.event.issue.number }}
          path: |
            predict.json
            estimate.json
            comment.md
          if-no-files-found: ignore
  allocate:
    needs: estimate
    if: needs.estimate.outputs.estimated == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: prism-cfo-allocation
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      CFO_OAUTH_CLIENT_ID: ${{ secrets.CFO_OAUTH_CLIENT_ID }}
      CFO_OAUTH_REFRESH_TOKEN: ${{ secrets.CFO_OAUTH_REFRESH_TOKEN }}
      CFO_SECRET_WRITE_TOKEN: ${{ secrets.CFO_SECRET_WRITE_TOKEN }}
    steps:
      - name: Check GitHub secret read and write access before CFO OAuth
        env:
          GH_TOKEN: ${{ secrets.CFO_SECRET_WRITE_TOKEN }}
        run: |
          if output=$(gh api -i "repos/$GITHUB_REPOSITORY/actions/secrets/public-key" 2>&1); then
            printf 'public-key GET: %s\n' "$(printf '%s\n' "$output" | grep -m1 '^HTTP/')"
          else
            printf '%s\n' "$output" | grep -E '^HTTP/|^gh:' || true
            exit 1
          fi
          if output=$(GH_DEBUG=api gh secret set CFO_SECRET_WRITE_PREFLIGHT --repo "$GITHUB_REPOSITORY" --body ok 2>&1); then
            printf '%s\n' "$output" | grep '^< HTTP/' | sed 's/^</dummy secret set:/'
          else
            printf '%s\n' "$output" | grep -E '^< HTTP/|^gh:' || true
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: Bhavya031/Prisme
          ref: main
          path: prism
          token: ${{ secrets.PRISME_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download this run's estimate
        env:
          RUN_ID: ${{ github.run_id }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "prism-estimate-$ISSUE_NUMBER" --dir "$RUNNER_TEMP/prism-estimate"
          test -s "$RUNNER_TEMP/prism-estimate/estimate.json"
          gh api -H 'Accept: application/vnd.github.raw' "repos/$GITHUB_REPOSITORY/contents/.github/prism.json" > "$RUNNER_TEMP/prism.json"
      - name: Allocate in the synthetic CFO.ai tables and read back
        env:
          RUN_ID: ${{ github.run_id }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PYTHONPATH: ${{ github.workspace }}/prism/src
        run: |
          python -m prism.cfo_actions "$RUNNER_TEMP/prism-estimate/estimate.json" "$RUN_ID" \
            --issue-number "$ISSUE_NUMBER" --config "$RUNNER_TEMP/prism.json" --output "$RUNNER_TEMP/cfo-allocation.json"
      - uses: actions/upload-artifact@v4
        with:
          name: prism-cfo-allocation-${{ github.event.issue.number }}-${{ github.run_id }}
          path: ${{ runner.temp }}/cfo-allocation.json
