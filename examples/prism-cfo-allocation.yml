name: Prism automated estimation and allocation validation

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Saved Prism estimate run in this repository
        required: true
      issue_number:
        description: Issue the saved estimate belongs to
        required: true
      preflight_only:
        description: Check GitHub secret write access without CFO OAuth
        type: boolean
        default: false

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: prism-cfo-allocation
  cancel-in-progress: false

jobs:
  allocate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      CFO_OAUTH_CLIENT_ID: ${{ secrets.CFO_OAUTH_CLIENT_ID }}
      CFO_OAUTH_REFRESH_TOKEN: ${{ secrets.CFO_OAUTH_REFRESH_TOKEN }}
      CFO_SECRET_WRITE_TOKEN: ${{ secrets.CFO_SECRET_WRITE_TOKEN }}
    steps:
      - name: Check GitHub secret read and write access before CFO OAuth
        env:
          GH_TOKEN: ${{ secrets.CFO_SECRET_WRITE_TOKEN }}
        run: |
          if output=$(gh api -i "repos/$GITHUB_REPOSITORY/actions/secrets/public-key" 2>&1); then
            printf 'public-key GET: %s\n' "$(printf '%s\n' "$output" | grep -m1 '^HTTP/')"
          else
            printf '%s\n' "$output" | grep -E '^HTTP/|^gh:' || true
            exit 1
          fi
          if output=$(GH_DEBUG=api gh secret set CFO_SECRET_WRITE_PREFLIGHT --repo "$GITHUB_REPOSITORY" --body ok 2>&1); then
            printf '%s\n' "$output" | grep '^< HTTP/' | sed 's/^</dummy secret set:/'
          else
            printf '%s\n' "$output" | grep -E '^< HTTP/|^gh:' || true
            exit 1
          fi
      - uses: actions/checkout@v4
        if: ${{ !inputs.preflight_only }}
        with:
          repository: Bhavya031/Prisme
          ref: main
          path: prism
          token: ${{ secrets.PRISME_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: ${{ !inputs.preflight_only }}
        with:
          python-version: "3.12"
      - name: Download the saved estimate; no discovery or model call
        if: ${{ !inputs.preflight_only }}
        env:
          RUN_ID: ${{ inputs.run_id }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ && "$ISSUE_NUMBER" =~ ^[0-9]+$ ]] || { echo 'run_id and issue_number must be numeric' >&2; exit 1; }
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "prism-estimate-$ISSUE_NUMBER" --dir "$RUNNER_TEMP/prism-estimate"
          test -s "$RUNNER_TEMP/prism-estimate/estimate.json"
          gh api -H 'Accept: application/vnd.github.raw' "repos/$GITHUB_REPOSITORY/contents/.github/prism.json" > "$RUNNER_TEMP/prism.json"
      - name: Allocate in the synthetic CFO.ai tables and read back
        id: allocation
        if: ${{ !inputs.preflight_only }}
        env:
          RUN_ID: ${{ inputs.run_id }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          PYTHONPATH: ${{ github.workspace }}/prism/src
        run: |
          python -m prism.cfo_actions "$RUNNER_TEMP/prism-estimate/estimate.json" "$RUN_ID" \
            --issue-number "$ISSUE_NUMBER" --config "$RUNNER_TEMP/prism.json" --output "$RUNNER_TEMP/cfo-allocation.json"
      - name: Report budget allocation on the issue
        if: always() && steps.allocation.outcome != 'skipped'
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          REQUESTER: ${{ github.actor }}
        run: |
          if [ -s "$RUNNER_TEMP/cfo-allocation.json" ]; then
            python - "$RUNNER_TEMP/cfo-allocation.json" > "$RUNNER_TEMP/cfo-allocation.md" <<'PY'
          import json, os, sys
          from decimal import Decimal, InvalidOperation
          from html import escape

          data = json.load(open(sys.argv[1]))
          def number(value):
              try:
                  amount = Decimal(str(value))
                  return amount if amount.is_finite() else None
              except (InvalidOperation, TypeError):
                  return None
          def money(value):
              return f"${value:,.2f}" if value is not None else "—"

          budget = number(data.get("budget_usd"))
          spent = number(data.get("spent_usd"))
          reserved = number(data.get("reserved_before_usd"))
          cap = number(data.get("usd_cap")) or Decimal(0)
          available = number(data.get("available_usd"))
          left = (number(data.get("available_balance_usd")) if data.get("already_recorded")
                  else available - cap if available is not None else None)
          maximum = number(data.get("request_limit_usd"))
          status = data["decision"]
          print(f"### Prism budget allocation: {status}\n")
          print(f"Requested by @{os.environ['REQUESTER']}\n")
          print("Automated estimation and allocation; decided by the budget rule saved in CFO.ai.\n")
          if data.get("already_recorded"):
              print("This request was already recorded; no new reservation was added.\n")
          files = ", ".join("`" + escape(path, quote=False).replace("`", "'").replace("|", "/").replace("\n", " ").replace("\r", " ") + "`"
                            for path in data.get("predicted_files", [])) or "none"
          print(f"Predicted files: {files}\n")
          print("| | USD |\n|---|---:|")
          for label, value in (("Repository budget", budget), ("Spent so far", spent),
                               ("Reserved before this request", reserved), ("This request (cap)", cap),
                               ("Left after this request", left), ("Max per request", maximum)):
              print(f"| {label} | {money(value)} |")
          print(f"\nChosen model: `{data.get('chosen_model') or '—'}`")
          print(f"\nReason: {data['reason']}")
          print("\nSuggested models\n")
          print("| Model | Estimated cost |\n|---|---:|")
          for item in data.get("recommendations", []):
              print(f"| {item['model']} | {money(number(item['usd']))} |")
          print("\n<details><summary>Other models</summary>\n")
          print("| Model | Estimated cost |\n|---|---:|")
          for item in data.get("other_models", []):
              print(f"| {item['model']} | {money(number(item['usd']))} |")
          print("\n</details>")
          print(f"\nRequest: `{data['request_id']}`")
          PY
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/cfo-allocation.md" || echo 'Could not post budget allocation comment' >&2
          fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.allocation.outcome != 'skipped'
        with:
          name: prism-cfo-allocation-${{ inputs.run_id }}
          path: ${{ runner.temp }}/cfo-allocation.json
